<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="description" content="입체 들판과 바다로 둘러싸인 화의 섬 노을마을을 걷고, 들판에서 기념물을 찾는 작은 생활 게임.">
  <title>오행의 집</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/village.css">
  <script defer src="./js/island-assets.js"></script>
  <script defer src="./js/coast.js"></script>
  <script defer src="./js/world.js"></script>
  <script defer src="./js/scene.js"></script>
  <script defer src="./js/landscape.js"></script>
  <script defer src="./js/decor.js"></script>
  <script defer src="./js/mailbox.js"></script>
  <script defer src="./js/home.js"></script>
  <script defer src="./js/harvest.js"></script>
  <script defer src="./js/neighbors.js"></script>
  <script defer src="./js/chat.js"></script>
  <script defer src="./js/game.js"></script>
</head>
<body>
<section id="home" class="home" aria-labelledby="home-title" hidden>
  <canvas id="home-clouds" aria-hidden="true"></canvas>
  <div class="home-content">
    <header class="home-heading">
      <div class="home-seal" aria-hidden="true">五</div>
      <h1 id="home-title">오행의 집</h1>
    </header>
    <nav class="home-nav" aria-label="시작 메뉴">
      <button type="button" id="home-resume" disabled>이어하기</button>
      <button type="button" id="home-play">새 게임시작</button>
      <button type="button" id="home-code">섬 코드</button>
      <button type="button" id="home-help">게임 방법</button>
    </nav>
    <button type="button" id="home-sound" aria-pressed="false">소리 끔</button>
  </div>
</section>
<dialog id="home-dialog" aria-labelledby="home-dialog-title">
  <div class="dialog-head"><h2 id="home-dialog-title"></h2><button id="home-close" class="close" aria-label="닫기">×</button></div>
  <div id="home-dialog-body"></div>
</dialog>
<main id="game" aria-label="노을마을" hidden><div class="stage" id="stage">
            <canvas id="view" tabindex="0" aria-label="노을마을 산책. 방향키 또는 WASD로 걷고 E로 가까운 사물을 살펴봅니다. 땅을 누르면 그곳으로 걸어갑니다."></canvas>
            <div class="position-chip"><i data-icon="pin"></i><span id="location">마을 어귀</span></div>
            <button type="button" id="map-top" class="float-map" title="섬 지도 (M)" aria-label="섬 지도 열기"><i data-icon="map"></i></button>
            <button type="button" class="hud-menu" id="menu-open" aria-label="수집 가방 열기" aria-haspopup="dialog"><i data-icon="bag" aria-hidden="true"></i></button>
<div id="loading" class="loading" role="status"><span id="boot-text">아이폰에서 플레이하려면 Safari에서 게임을 열어 주세요.</span><a id="boot-link" href="https://ohaeng-home-noeul-village.rompingrhino4.chatgpt.site" target="_blank" rel="noopener">게임 주소 열기</a></div>
            <div class="travel-overlay" id="travel-overlay" role="status" hidden><span id="travel-message"></span></div>
            <span id="notice" class="scene-notice" role="status" aria-live="polite" hidden></span>
            <div id="chat-bubbles" aria-live="off"></div>
            <button id="chat-open" aria-label="말풍선 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H10l-6 4v-4H3V5z"/><path d="M7 10h2m2 0h2m2 0h2"/></svg></button>
            <button id="announce-open" aria-label="전체 공지 쓰기" title="전체 공지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9h5l11-5v15L8 14H3zm3 5 2 6h3l-2-5M22 9v5"/></svg></button><div id="news-banner" role="status" hidden></div>
            <form id="chat-form" hidden><input id="chat-input" aria-label="섬에서 할 말" maxlength="70" placeholder="섬에서 할 말을 입력하세요" autocomplete="off" enterkeyhint="send"><button>보내기</button><button type="button" id="chat-close" aria-label="말풍선 닫기">×</button><small id="chat-status" role="status"></small></form>
            <button id="act" class="act" type="button" hidden><kbd>E</kbd><span id="act-text">살펴보기</span></button>
            <div id="stick" class="stick" role="group" aria-label="이동 조이스틱"><span class="stick-dots"></span><span id="stick-knob" class="stick-knob"></span></div>
            <button id="run" class="run-control" type="button" aria-label="빠르게 걷기 전환" aria-pressed="false"><i data-icon="run"></i></button>
          </div></main>
<dialog id="menu-dialog" aria-labelledby="menu-title"><div class="dialog-head"><h2 id="menu-title">산책 수첩</h2><div class="notebook-header-actions"><button type="button" class="close" id="notebook-tools-toggle" aria-label="도구" aria-expanded="false" aria-controls="notebook-tools"><i data-icon="tools" aria-hidden="true"></i></button><button class="close" id="menu-close" aria-label="산책 수첩 닫기" autofocus>×</button></div></div><nav id="notebook-tools" aria-label="게임 도구" hidden><button type="button" id="sound" class="quiet-icon sound-control" aria-label="소리 켜기" title="소리 켜기" aria-pressed="false"><i data-icon="mute"></i><span>소리 끔</span></button><button type="button" id="game-home" class="quiet-icon">시작 화면</button><button type="button" id="help" class="quiet-icon"><i data-icon="controller"></i><span>게임 방법</span></button></nav><div class="book-body">
          <div id="notebook-islands" class="notebook-islands" role="group" aria-label="섬별 수집 기록"></div>
          <div class="collection-head"><h3 id="notebook-island">마을의 기념물</h3><span class="count" id="count"></span></div>
          <div id="souvenirs" class="notebook-items"></div>
          <p id="leaf-total" class="book-hint" hidden></p>
        </div><div class="menu-status"><span id="save-status" class="save-status" role="status"><i data-icon="check"></i><span>자동 저장</span></span></div></dialog>
  <dialog id="travel-confirm" aria-labelledby="travel-question">
    <div class="dialog-head"><h2 id="travel-question"></h2></div>
    <form method="dialog" class="travel-confirm-actions">
      <button type="submit" class="secondary" value="no" autofocus>아니오</button>
      <button type="submit" class="primary" value="yes">예</button>
    </form>
  </dialog>
  <dialog id="panel" aria-labelledby="panel-title"><div class="dialog-head"><div><p class="eyebrow" id="panel-eyebrow"></p><h2 id="panel-title"></h2></div><div class="notebook-header-actions"><button type="button" id="interior-tools" class="close" aria-label="집 꾸미기" title="집 꾸미기" aria-expanded="false" aria-controls="interior-editor" hidden><i data-icon="houseRepair" aria-hidden="true"></i></button><button class="close" id="close" aria-label="닫기"><i data-icon="close"></i></button></div></div><div id="panel-body"></div></dialog>
  <noscript>노을마을에서 산책하려면 브라우저의 자바스크립트를 켜 주세요.</noscript>
</body></html>
